openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: roast
    description: GitHub roast operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /roast:
    post:
      operationId: roastGithubUser
      tags: [roast]
      summary: Roast a GitHub user
      description: Fetches GitHub profile data and generates an AI-powered roast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoastInput"
      responses:
        "200":
          description: Roast generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoastResult"
        "404":
          description: GitHub user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /roast/history:
    get:
      operationId: getRoastHistory
      tags: [roast]
      summary: Get recent roast history
      description: Returns the most recent roasts generated
      responses:
        "200":
          description: List of recent roasts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoastRecord"
  /roast/stats:
    get:
      operationId: getRoastStats
      tags: [roast]
      summary: Get roast statistics
      description: Returns fun stats about roasts generated
      responses:
        "200":
          description: Roast statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoastStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoastInput:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: GitHub username to roast
          minLength: 1
        intensity:
          type: string
          enum: [mild, medium, savage]
          description: How brutal the roast should be
    RoastResult:
      type: object
      required:
        - roast
        - username
        - githubProfile
      properties:
        roast:
          type: string
          description: The AI-generated roast text
        username:
          type: string
        githubProfile:
          $ref: "#/components/schemas/GithubProfile"
    GithubProfile:
      type: object
      required:
        - login
        - publicRepos
        - followers
        - following
      properties:
        login:
          type: string
        name:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        publicRepos:
          type: integer
        followers:
          type: integer
        following:
          type: integer
        createdAt:
          type: string
        avatarUrl:
          type: string
        topLanguages:
          type: array
          items:
            type: string
        mostStarredRepo:
          type: ["string", "null"]
        totalStars:
          type: integer
    RoastRecord:
      type: object
      required:
        - id
        - username
        - roast
        - intensity
        - createdAt
      properties:
        id:
          type: integer
        username:
          type: string
        avatarUrl:
          type: ["string", "null"]
        roast:
          type: string
        intensity:
          type: string
        createdAt:
          type: string
    RoastStats:
      type: object
      required:
        - totalRoasts
        - mostRoastedUser
        - mostCommonLanguage
        - averageRepos
      properties:
        totalRoasts:
          type: integer
        mostRoastedUser:
          type: ["string", "null"]
        mostCommonLanguage:
          type: ["string", "null"]
        averageRepos:
          type: number
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
